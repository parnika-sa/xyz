<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Business Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #0066ff;
            --accent-hover: #0052cc;
            --success: #00c853;
            --error: #ff3d00;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --border-color: #2a2a2a;
            --accent: #3d8bff;
            --accent-hover: #5c9fff;
            --success: #00e676;
            --error: #ff5252;
            --shadow: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .theme-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .theme-icon.active {
            background: var(--accent);
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 24px var(--shadow);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-label {
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .btn {
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0066ff 0%, #00c6ff 100%);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2);
            border: 2px solid transparent;
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 0.8;
            }
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            position: relative;
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-secondary) 100%);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-secondary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 102, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-secondary:hover::after {
            left: 100%;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            transition: transform 0.3s;
        }

        .btn:hover .btn-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .btn-primary:hover .btn-icon {
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1.2) rotate(10deg) translateY(0);
            }

            50% {
                transform: scale(1.2) rotate(10deg) translateY(-5px);
            }
        }

        .progress-container {
            margin-top: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            transition: width 0.3s;
            border-radius: 8px;
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent);
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .status-message.error {
            border-left-color: var(--error);
            background: rgba(255, 61, 0, 0.1);
        }

        .status-message.success {
            border-left-color: var(--success);
            background: rgba(0, 200, 83, 0.1);
        }

        .log-container {
            grid-column: 1 / -1;
        }

        .log-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .log-entry:hover {
            background: var(--bg-card);
        }

        .log-time {
            color: var(--text-secondary);
            margin-right: 1rem;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .results-table th,
        .results-table td {
            padding: 0.875rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .results-table th {
            background: var(--bg-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .results-table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .download-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1.25rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .download-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo">🗺️</div>
                <div class="logo-text">Maps Business Scraper</div>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()">
                <div class="theme-icon" id="lightIcon">☀️</div>
                <div class="theme-icon active" id="darkIcon">🌙</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2 class="card-title">⚙️ Scraper Configuration</h2>
            <form id="scraperForm">
                <div class="form-group">
                    <label for="keyword">Search Keyword *</label>
                    <input type="text" id="keyword" name="keyword" placeholder="e.g., restaurants, dentists, hotels"
                        required>
                </div>

                <div class="form-group">
                    <label for="city">City/Location *</label>
                    <input type="text" id="city" name="city" placeholder="e.g., New York, London, Tokyo" required>
                </div>

                <div class="form-group">
                    <label for="maxResults">Max Results (optional)</label>
                    <input type="number" id="maxResults" name="maxResults" placeholder="Leave empty for all results"
                        min="1">
                </div>

                <div class="form-group">
                    <label for="timeout">Timeout (seconds)</label>
                    <input type="number" id="timeout" name="timeout" value="300" min="60">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="noEmails" name="noEmails">
                    <label for="noEmails" class="checkbox-label">Skip email extraction</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="headless" name="headless" checked>
                    <label for="headless" class="checkbox-label">Run in headless mode</label>
                </div>

                <button type="submit" class="btn btn-primary" id="startBtn">
                    <span class="btn-icon">🚀</span>
                    <span>Start Scraping</span>
                </button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">📊 Status & Progress</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalBusinesses">0</div>
                    <div class="stat-label">Found</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="progressPercent">0%</div>
                    <div class="stat-label">Progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statusIndicator">⏸️</div>
                    <div class="stat-label">Status</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
                <div class="status-message" id="statusMessage">Ready to start scraping</div>
            </div>

            <div class="download-buttons" id="downloadButtons" style="display: none;">
                <button class="btn btn-secondary" onclick="downloadCSV()" style="flex: 1;">
                    <span class="btn-icon">📄</span>
                    <span>Download CSV</span>
                </button>
                <button class="btn btn-secondary" onclick="downloadJSON()" style="flex: 1;">
                    <span class="btn-icon">📋</span>
                    <span>Download JSON</span>
                </button>
            </div>
        </div>

        <div class="card log-container">
            <h2 class="card-title">📝 Activity Log</h2>
            <div class="log-content" id="logContent">
                <div class="log-entry">
                    <span class="log-time">[${new Date().toLocaleTimeString()}]</span>
                    <span>System initialized and ready</span>
                </div>
            </div>
        </div>

        <div class="card" id="resultsCard" style="display: none; grid-column: 1 / -1;">
            <h2 class="card-title">🎯 Results</h2>
            <div style="overflow-x: auto;">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Address</th>
                            <th>Phone</th>
                            <th>Website</th>
                            <th>Rating</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let statusCheckInterval;

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);

            const lightIcon = document.getElementById('lightIcon');
            const darkIcon = document.getElementById('darkIcon');

            if (newTheme === 'dark') {
                lightIcon.classList.remove('active');
                darkIcon.classList.add('active');
            } else {
                darkIcon.classList.remove('active');
                lightIcon.classList.add('active');
            }

            localStorage.setItem('theme', newTheme);
            addLog(`Theme switched to ${newTheme} mode`);
        }

        // Load saved theme
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            const lightIcon = document.getElementById('lightIcon');
            const darkIcon = document.getElementById('darkIcon');

            if (savedTheme === 'dark') {
                lightIcon.classList.remove('active');
                darkIcon.classList.add('active');
            } else {
                darkIcon.classList.remove('active');
                lightIcon.classList.add('active');
            }
        });

        function addLog(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span>${message}</span>`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        document.getElementById('scraperForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                keyword: document.getElementById('keyword').value,
                city: document.getElementById('city').value,
                max_results: document.getElementById('maxResults').value || null,
                timeout: parseInt(document.getElementById('timeout').value),
                no_emails: document.getElementById('noEmails').checked,
                headless: document.getElementById('headless').checked
            };

            addLog(`Starting scrape: ${formData.keyword} in ${formData.city}`);

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    addLog('Scraper started successfully');
                    document.getElementById('startBtn').disabled = true;
                    startStatusCheck();
                } else {
                    addLog(`Error: ${result.error}`, 'error');
                    updateStatus({ error: result.error });
                }
            } catch (error) {
                addLog(`Network error: ${error.message}`, 'error');
            }
        });

        function startStatusCheck() {
            statusCheckInterval = setInterval(checkStatus, 1000);
        }

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                updateStatus(status);

                if (!status.running) {
                    clearInterval(statusCheckInterval);
                    document.getElementById('startBtn').disabled = false;
                }
            } catch (error) {
                console.error('Status check failed:', error);
            }
        }

        function updateStatus(status) {
            const progressBar = document.getElementById('progressBar');
            const statusMessage = document.getElementById('statusMessage');
            const totalBusinesses = document.getElementById('totalBusinesses');
            const progressPercent = document.getElementById('progressPercent');
            const statusIndicator = document.getElementById('statusIndicator');

            progressBar.style.width = status.progress + '%';
            progressPercent.textContent = status.progress + '%';
            totalBusinesses.textContent = status.total_businesses || 0;

            if (status.running) {
                statusIndicator.textContent = '🔄';
                statusMessage.className = 'status-message';
                statusMessage.textContent = status.message || 'Processing...';
            } else if (status.error) {
                statusIndicator.textContent = '❌';
                statusMessage.className = 'status-message error';
                statusMessage.textContent = '❌ ' + status.error;
                addLog(`Error: ${status.error}`, 'error');
            } else if (status.results) {
                statusIndicator.textContent = '✅';
                statusMessage.className = 'status-message success';
                statusMessage.textContent = status.message || 'Complete!';
                addLog(`Scraping completed: ${status.total_businesses} businesses found`);
                showResults(status.results);
            } else {
                statusIndicator.textContent = '⏸️';
            }
        }

        function showResults(results) {
            const resultsCard = document.getElementById('resultsCard');
            const resultsBody = document.getElementById('resultsBody');
            const downloadButtons = document.getElementById('downloadButtons');

            resultsCard.style.display = 'block';
            downloadButtons.style.display = 'flex';

            resultsBody.innerHTML = results.map(business => `
                <tr>
                    <td>${business.name || 'N/A'}</td>
                    <td>${business.address || 'N/A'}</td>
                    <td>${business.phone || 'N/A'}</td>
                    <td>${business.website ? `<a href="${business.website}" target="_blank" style="color: var(--accent);">Visit</a>` : 'N/A'}</td>
                    <td>${business.rating || 'N/A'}</td>
                </tr>
            `).join('');
        }

        function downloadCSV() {
            addLog('Downloading CSV file...');
            window.location.href = '/api/results/csv';
        }

        function downloadJSON() {
            addLog('Downloading JSON file...');
            window.location.href = '/api/results/json';
        }
    </script>
</body>

</html>
